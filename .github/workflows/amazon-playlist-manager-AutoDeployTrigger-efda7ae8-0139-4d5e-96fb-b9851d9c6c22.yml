name: Trigger auto deployment for amazon-playlist-manager

on:
  push:
    branches:
      - main
    paths:
      - '**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AMAZONPLAYLISTMANAGER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AMAZONPLAYLISTMANAGER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AMAZONPLAYLISTMANAGER_AZURE_SUBSCRIPTION_ID }}

      - name: Install Container App CLI Extension
        run: az extension add --name containerapp --upgrade

      - name: Build and Deploy Direct from Source
        run: |
          az containerapp up \
            --name amazon-playlist-manager \
            --resource-group DEV \
            --source .
