name: Trigger auto deployment for amazon-playlist-manager

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/amazon-playlist-manager-AutoDeployTrigger-efda7ae8-0139-4d5e-96fb-b9851d9c6c22.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AMAZONPLAYLISTMANAGER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AMAZONPLAYLISTMANAGER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AMAZONPLAYLISTMANAGER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          runtimeStack: 'dotnet:8.0'
          containerAppName: amazon-playlist-manager
          resourceGroup: DEV
          disableTelemetry: true
